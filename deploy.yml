name: Deploy Gọn Link

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set D1 database ID
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const id = process.env.D1_DATABASE_ID; if (!id) throw new Error('Set the D1_DATABASE_ID GitHub Actions secret.'); const path = 'wrangler.jsonc'; const config = fs.readFileSync(path, 'utf8').replace('00000000-0000-4000-8000-000000000000', id); fs.writeFileSync(path, config);"

      - name: Initialize D1 schema
        run: npm run db:init

      - name: Deploy Worker
        run: npm run deploy